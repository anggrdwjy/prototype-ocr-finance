services:
  db:
    image: postgres:16-alpine
    container_name: ocr_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-ocr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr_user} -d ${POSTGRES_DB:-ocr_db}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ocr_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ocr_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ocr_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET di .env (min 32 karakter)}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-12}
      OCR_PROVIDER: tesseract
      TESSERACT_LANG: ind+eng
      TESSERACT_PSM: "6"
      INIT_CFO_NAME: ${INIT_CFO_NAME:-}
      INIT_CFO_EMAIL: ${INIT_CFO_EMAIL:-}
      INIT_CFO_PASSWORD: ${INIT_CFO_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: ocr_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
